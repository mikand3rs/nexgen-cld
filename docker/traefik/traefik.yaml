# Traefik v3 static configuration — BMOS 3.2.
# HTTP on :80. TLS is opt-in — see docs/tls.md for the Stage B HTTPS setup.

entryPoints:
  web:
    address: ":80"

providers:
  docker:
    # Only route containers that opt in with traefik.enable=true.
    exposedByDefault: false
    # Nginx is on two networks; without this Traefik can pick its
    # internal backend IP, which Traefik cannot reach -> 504.
    network: nexgen-bmos_edge

log:
  level: INFO
